# Auto-deploy the mock backend to Fly.io on every push to main.
# Vercel deploys the frontend via its own native Git integration (no workflow
# needed); this handles the backend half so both redeploy on update.
#
# Requires repo secret FLY_API_TOKEN (a Fly deploy token:
#   fly tokens create deploy | gh secret set FLY_API_TOKEN).
name: Deploy backend to Fly.io

on:
  push:
    branches: [main]
    # Only redeploy when something the image depends on changes.
    paths:
      - "mock_backend/**"
      - "spec/**"
      - "requirements.txt"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
