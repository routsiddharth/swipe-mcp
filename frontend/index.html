<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <!-- Content-Security-Policy: defence-in-depth for the user's Swipe key (held
       in localStorage). The key protection is `connect-src` — even if an XSS
       slipped past the HTML sanitizer, the browser will refuse to send the key
       to any origin not listed here (no exfiltration to attacker.com), and
       `img-src` blocks beacon exfiltration too.
       ⚠️ DEPLOY: replace the localhost backend below with YOUR mock-backend
       origin, and prefer serving this as a real CSP *response header* at your
       static host (see DEPLOYMENT.md). `unsafe-eval`/`unsafe-inline` are only
       needed for the in-browser Babel — precompile the JSX in prod to drop them. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com 'unsafe-inline' 'unsafe-eval';
    style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
    font-src https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://swipe-mcp-mock.fly.dev https://app.getswipe.in;
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
    object-src 'none';
  " />
  <title>Swipe · Talk to your billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- deployment config (git-ignored; sets window.SWIPE_API_TOKEN/SWIPE_MODE
       from your env via scripts/gen_frontend_config.py). Optional — absent is
       fine; the app falls back to the Connection panel / mock mode. -->
  <script src="config.js" onerror="this.remove()"></script>

  <!-- engine + tool registry (plain JS) -->
  <script src="engine.js"></script>
  <script src="tools.js"></script>

  <!-- UI (babel) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- Vercel Web Analytics. This is a static site (no Next.js/bundler), so we use
       the plain-HTML snippet, not @vercel/analytics. Script + beacon are both
       served from our own origin under /_vercel/insights/*, already covered by
       the CSP's script-src 'self' / connect-src 'self'. Requires Web Analytics
       to be enabled for this project in the Vercel dashboard. -->
  <script>
    window.va = window.va || function () { (window.vai = window.vai || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
